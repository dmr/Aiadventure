<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Vibe Check app icon — a terminal/chat card with a "passed" checkmark -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5e8d0"/>
      <stop offset="1" stop-color="#e8c98a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf6ea"/>
      <stop offset="1" stop-color="#f1e3c8"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- terminal / chat card (kept inside the maskable safe zone) -->
  <rect x="116" y="120" width="280" height="244" rx="34" fill="#3d2414"/>
  <rect x="116" y="120" width="280" height="60" rx="34" fill="#5a3a22"/>
  <rect x="116" y="150" width="280" height="30" fill="#5a3a22"/>
  <!-- window dots -->
  <circle cx="150" cy="150" r="9" fill="#d2693f"/>
  <circle cx="180" cy="150" r="9" fill="#d9a441"/>
  <circle cx="210" cy="150" r="9" fill="#6b9e5a"/>

  <!-- inner screen -->
  <rect x="140" y="196" width="232" height="144" rx="16" fill="url(#card)"/>

  <!-- prompt caret -->
  <text x="164" y="290" font-family="monospace" font-size="64" font-weight="700" fill="#8a5424">&gt;_</text>

  <!-- big "passed the vibe check" tick badge -->
  <circle cx="356" cy="344" r="74" fill="#5a9e5a"/>
  <circle cx="356" cy="344" r="74" fill="none" stroke="#fbf6ea" stroke-width="8"/>
  <path d="M324 344 l22 24 l44 -52" fill="none" stroke="#fbf6ea" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
